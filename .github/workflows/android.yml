name: Build Android Companion app (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write              # to put the APK on the Releases page

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # the signing key comes from the repository secrets, never from the code
      - name: Signing key from GitHub Secrets
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PW" ]; then
            echo "::error::Add the secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions), then run this workflow again."
            exit 1
          fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/companion-signing.p12"
          echo "BN_KEYSTORE_FILE=$RUNNER_TEMP/companion-signing.p12" >> "$GITHUB_ENV"
          echo "::add-mask::$KEY_PW"
          echo "BN_KEYSTORE_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BurhanNexusCompanion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BurhanNexusCompanion-apk
          path: BurhanNexusCompanion.apk

      # the newest APK always at one fixed address (Releases page), easy to open on the phone
      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-latest
          name: Burhan Nexus Business Companion (Android app, latest)
          body: Install BurhanNexusCompanion.apk on your Android phone. This file is replaced by every new build.
          files: BurhanNexusCompanion.apk
          make_latest: false
