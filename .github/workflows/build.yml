name: Build Windows exe

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]          # every push builds a fresh exe
    tags: ["v*"]              # pushing a tag like v0.1.0 also creates a Release with the exe

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          UI_SHOTS: ui_shots              # screenshots of the data-entry windows, made by tests/test_ui_forms.py
        run: python -m pytest -q -rs

      - name: Publish the window screenshots (for checking the layout)
        if: github.ref == 'refs/heads/main' && hashFiles('ui_shots/*.png') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-screenshots
          name: Window screenshots (automatic check, not a download for users)
          body: Made by the automatic tests on every build. Not needed by users.
          prerelease: true
          make_latest: false
          files: ui_shots/*.png

      - name: Build the program (folder version, starts fast)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name BusinessManager --icon assets/app.ico
          --hidden-import rapidfuzz --hidden-import arabic_reshaper
          --hidden-import bidi --hidden-import openpyxl
          --collect-submodules reportlab.graphics.barcode
          main.py

      - name: Build the key generator (owner only)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name KeyGenerator --icon assets/app.ico
          --paths . tools/keygen_gui.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: |
          $v = python -c "from app.config import APP_VERSION; print(APP_VERSION)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss

      - name: Upload installer (download it from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: BusinessManager-Setup
          path: installer_output/BusinessManager-Setup.exe

      - name: Upload key generator (for the owner only - needs the owner private key)
        uses: actions/upload-artifact@v4
        with:
          name: KeyGenerator
          path: dist/KeyGenerator.exe

      # the newest installer always at one fixed address (Releases page), no GitHub login needed
      - name: Publish the installer on the Releases page
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Burhan Nexus Business Manager (Windows, latest)
          body: Download BusinessManager-Setup.exe and run it. Your data is kept. This file is replaced by every new build.
          files: installer_output/BusinessManager-Setup.exe
          make_latest: true

      - name: Attach installer to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/BusinessManager-Setup.exe
