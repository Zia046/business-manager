name: Build Windows exe

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]          # every push builds a fresh exe
    tags: ["v*"]              # pushing a tag like v0.1.0 also creates a Release with the exe

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build the program (folder version, starts fast)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name BusinessManager --icon assets/app.ico
          --hidden-import rapidfuzz --hidden-import arabic_reshaper
          --hidden-import bidi --hidden-import openpyxl
          --collect-submodules reportlab.graphics.barcode
          main.py

      - name: Build the key generator (owner only)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name KeyGenerator --icon assets/app.ico
          --paths . tools/keygen_gui.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: |
          $v = python -c "from app.config import APP_VERSION; print(APP_VERSION)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss

      - name: Upload installer (download it from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: BusinessManager-Setup
          path: installer_output/BusinessManager-Setup.exe

      - name: Upload key generator (for the owner only - needs the owner private key)
        uses: actions/upload-artifact@v4
        with:
          name: KeyGenerator
          path: dist/KeyGenerator.exe

      - name: Attach installer to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/BusinessManager-Setup.exe
