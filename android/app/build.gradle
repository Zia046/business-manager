plugins {
    id 'com.android.application'
}

android {
    namespace 'com.burhannexus.companion'
    compileSdk 34

    defaultConfig {
        applicationId "com.burhannexus.companion"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "3.0.3"
    }
    // One fixed key for every build, so a new APK installs over the old one (keeps the pairing and data).
    // The key is NOT in the repository: the GitHub workflow writes it from the repository secrets
    // ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions).
    signingConfigs {
        companion {
            storeFile file(System.getenv('BN_KEYSTORE_FILE') ?: 'missing-keystore.p12')
            storeType 'pkcs12'
            storePassword System.getenv('BN_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'companion'
            keyPassword System.getenv('BN_KEYSTORE_PASSWORD') ?: ''
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.companion
        }
        release {
            signingConfig signingConfigs.companion
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
