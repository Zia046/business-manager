plugins {
    id 'com.android.application'
}

android {
    namespace 'com.burhannexus.companion'
    compileSdk 34

    defaultConfig {
        applicationId "com.burhannexus.companion"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "2.2"
    }
    // One fixed key for every build, so a new APK installs over the old one (keeps the pairing and data).
    // Before this, every GitHub build signed with a new random debug key and Android refused the update.
    signingConfigs {
        companion {
            storeFile file('companion-signing.p12')
            storeType 'pkcs12'
            storePassword 'IyVNgX7bHcozfkkhY2ShZE9V'
            keyAlias 'companion'
            keyPassword 'IyVNgX7bHcozfkkhY2ShZE9V'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.companion
        }
        release {
            signingConfig signingConfigs.companion
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
