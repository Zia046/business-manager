plugins {
    id 'com.android.application'
}

android {
    namespace 'com.burhannexus.reminder'
    compileSdk 34

    defaultConfig {
        applicationId "com.burhannexus.reminder"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
